
<!-- Peachy Pest Bros offline brand override -->
<style id="peachy-brand-override">
:root{--peachy-black:#050505;--peachy-charcoal:#171717;--peachy-gray:#2A2A2A;--peachy-orange:#FF7A1A;--peachy-soft:#FFF3EA;}
html,body{background:#fff!important;color:var(--peachy-black)!important;}
a{color:inherit;}
.elementor-button,.elementor-button-link,button,[type=submit],.wp-element-button{background:var(--peachy-orange)!important;border-color:var(--peachy-orange)!important;color:#0A0A0A!important;font-weight:800!important;border-radius:999px!important;}
.elementor-button:hover,.elementor-button-link:hover{filter:brightness(.94)!important;transform:translateY(-1px);}
.elementor-heading-title span, .elementor-icon, .elementor-icon-list-icon svg, .elementor-star-rating i, .elementor-star-full{color:var(--peachy-orange)!important;fill:var(--peachy-orange)!important;}
.elementor-heading-title{color:var(--peachy-black)!important;}
.elementor-nav-menu a:hover,.elementor-nav-menu .elementor-item-active{color:var(--peachy-orange)!important;}
.elementor-section, .e-con{--e-global-color-primary:var(--peachy-black)!important;--e-global-color-secondary:var(--peachy-charcoal)!important;--e-global-color-accent:var(--peachy-orange)!important;}
.e-con[style*='background'], section[style*='background']{background-color:inherit;}
.elementor-widget-container a[href^='tel'], .elementor-widget-container a[href^='mailto']{color:var(--peachy-orange)!important;}
header, .elementor-location-header, footer, .elementor-location-footer{background:#0A0A0A!important;color:#fff!important;}
header a, footer a, header .elementor-heading-title, footer .elementor-heading-title, header .elementor-icon-list-text, footer .elementor-icon-list-text{color:#fff!important;}
footer .elementor-widget-text-editor, footer p, footer span{color:rgba(255,255,255,.78)!important;}
.elementor-location-header .elementor-button, header .elementor-button{background:var(--peachy-orange)!important;color:#0A0A0A!important;}
.elementor-widget-image img[src*='peachy-pest-bros-logo.svg']{object-fit:contain!important;background:#0A0A0A!important;border-radius:12px!important;padding:4px!important;}
body:before{content:'Peachy Pest Bros demo — replace phone, email, service area, license, reviews before publishing';position:fixed;left:14px;bottom:14px;z-index:99999;background:#0A0A0A;color:#fff;border:1px solid #FF7A1A;border-radius:999px;padding:8px 12px;font:12px/1.2 Arial,sans-serif;box-shadow:0 8px 20px rgba(0,0,0,.2);}
@media(max-width:767px){body:before{left:8px;right:8px;text-align:center;border-radius:12px;}}
</style>
